name: notechondria-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:-trancezero/notechondria-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:9080/api/v1}
    ports:
      - ${FRONTEND_HOST_PORT:-9060}:80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
