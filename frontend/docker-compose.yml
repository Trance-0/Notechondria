name: notechondria-frontend

services:
  frontend:
    image: ${FRONTEND_IMAGE:-trancezero/notechondria-frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api/v1}
    environment:
      FRONTEND_BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-http://host.docker.internal:9080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${FRONTEND_HOST_PORT:-9060}:80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
