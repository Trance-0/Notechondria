version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  archive: ^3.4.10
  cupertino_icons: ^1.0.6
  file_selector: ^1.0.3
  flutter_math_fork: ^0.7.4
  flutter_markdown: ^0.7.3+1
  flutter_svg: ^2.1.0
  http: ^1.2.1
