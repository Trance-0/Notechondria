name: notechondria-planner

networks:
  notechondria-shared:
    external: true
    name: ${NOTECHONDRIA_SHARED_NETWORK:-notechondria-shared}

services:
  frontend:
    restart: unless-stopped
    image: ${FRONTEND_IMAGE:-trancezero/notechondria-planner:latest}
    build:
      context: ..
      dockerfile: planner_app/Dockerfile
      args:
        FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:9060/api/v1}
        APP_BASE_HREF: ${APP_BASE_HREF:-/}
        APP_VERSION: ${APP_VERSION:-}
    environment:
      FRONTEND_BACKEND_ORIGIN: ${FRONTEND_BACKEND_ORIGIN:-http://nginx}
    ports:
      - "127.0.0.1:${PLANNER_FRONTEND_HOST_PORT:-9062}:80"
    networks:
      notechondria-shared:
        aliases:
          - planner_frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
