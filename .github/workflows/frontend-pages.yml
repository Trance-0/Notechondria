name: frontend-pages

# Frontend-only Pages leg. The docs (mdBook) build/deploy lives in
# docs-pages.yml since 0.1.161 so a failure in either leg cannot block
# the other; both publish disjoint subtrees of gh-pages with
# keep_files: true under a shared concurrency group.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    # 0.1.68 flipped the upstream-target branch from `codex` back to
    # `main` (see docs/index.md §0). `VERSION` stays in the trigger so a
    # pure version-bump commit rebuilds the apps with the new baked
    # APP_VERSION. docs/** / README.md / sample.env now trigger
    # docs-pages.yml instead (0.1.161 split).
    branches: [ main ]
    paths:
      - 'frontend/editor_app/**'
      - 'frontend/planner_app/**'
      - 'frontend/portal_app/**'
      - 'frontend/notechondria_shared/**'
      - 'VERSION'
      - '.github/workflows/frontend-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Serializes gh-pages pushes with docs-pages.yml (same group) so the
# two independent deploy legs cannot race on the branch.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Read app version from ./VERSION
        id: appversion
        run: echo "value=$(tr -d '\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Test editor_app
        working-directory: frontend/editor_app
        run: |
          flutter pub get
          flutter test test/smoke_test.dart -r compact

      - name: Build editor_app
        working-directory: frontend/editor_app
        run: flutter build web --release --base-href /Notechondria/editor/ --no-web-resources-cdn --dart-define=APP_VERSION=${{ steps.appversion.outputs.value }}

      - name: Test planner_app
        working-directory: frontend/planner_app
        run: |
          flutter pub get
          flutter test test/smoke_test.dart -r compact

      - name: Build planner_app
        working-directory: frontend/planner_app
        run: flutter build web --release --base-href /Notechondria/planner/ --no-web-resources-cdn --dart-define=APP_VERSION=${{ steps.appversion.outputs.value }}

      - name: Test portal_app
        working-directory: frontend/portal_app
        run: |
          flutter pub get
          flutter test test/smoke_test.dart -r compact

      - name: Build portal_app
        working-directory: frontend/portal_app
        run: flutter build web --release --base-href /Notechondria/portal/ --no-web-resources-cdn --dart-define=APP_VERSION=${{ steps.appversion.outputs.value }}

      # 0.1.196: service workers stripped (STRIP_SERVICE_WORKER=true).
      # This Flutter SDK deprecated its service worker and now ships a
      # *self-destroying* `flutter_service_worker.js`, yet the bootstrap
      # still registered it every load — a browser could get caught
      # re-registering/unregistering it, serving a stale asset mix
      # (Firefox reported an NS_ERROR loading a font) and never painting
      # ("long loading, nothing returns"). This step now, when the repo
      # variable STRIP_SERVICE_WORKER == 'true':
      #   1. Removes `serviceWorkerSettings` from `_flutter.loader.load(…)`
      #      (both the inline-object and minified-variable forms) so no
      #      new worker is ever registered — every load fetches fresh.
      #   2. KEEPS a self-destroying worker at the registered scriptURL so
      #      a browser still holding a stale worker updates to it on its
      #      next navigation, unregisters, and reloads once — instead of
      #      404-ing on update and staying broken. (The old kill switch
      #      deleted the file, which stranded those browsers.)
      # Flip the variable back to 'false' to restore Flutter's default.
      - name: Strip service worker (kill switch)
        if: vars.STRIP_SERVICE_WORKER == 'true'
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          self_destroy = (
              "'use strict';\n"
              "self.addEventListener('install', () => self.skipWaiting());\n"
              "self.addEventListener('activate', (event) => {\n"
              "  event.waitUntil((async () => {\n"
              "    try { await self.registration.unregister(); } catch (e) {}\n"
              "    try {\n"
              "      const clients = await self.clients.matchAll({ type: 'window' });\n"
              "      for (const client of clients) {\n"
              "        if (client.url && 'navigate' in client) {\n"
              "          try { client.navigate(client.url); } catch (e) {}\n"
              "        }\n"
              "      }\n"
              "    } catch (e) {}\n"
              "  })());\n"
              "});\n"
          )
          for app in ('editor_app', 'planner_app', 'portal_app'):
              boot = Path(f'frontend/{app}/build/web/flutter_bootstrap.js')
              text = boot.read_text()
              # Drop the serviceWorkerSettings key so the loader never registers.
              text = re.sub(r"serviceWorkerSettings\s*:\s*\{[^{}]*\}\s*,?", "", text)
              text = re.sub(r"serviceWorkerSettings\s*:\s*[A-Za-z_$][\w$]*\s*,?", "", text)
              assert 'serviceWorkerSettings' not in text, f'{app}: strip did not remove serviceWorkerSettings'
              boot.write_text(text)
              # Serve a self-destroying worker for already-registered clients.
              Path(f'frontend/{app}/build/web/flutter_service_worker.js').write_text(self_destroy)
          PY

      - name: Stage Pages tree
        run: |
          mkdir -p /tmp/pages/editor /tmp/pages/planner /tmp/pages/portal
          cp -R frontend/editor_app/build/web/. /tmp/pages/editor/
          cp -R frontend/planner_app/build/web/. /tmp/pages/planner/
          cp -R frontend/portal_app/build/web/. /tmp/pages/portal/
          touch /tmp/pages/.nojekyll
          # Root URL now points at the portal app directly — it already carries
          # its own navigation into Editor / Planner / Activity / Settings.
          # See docs/TODO.md (Portal section) and docs/versions/0.1.18.md.
          cat > /tmp/pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Notechondria</title>
            <meta http-equiv="refresh" content="0; url=./portal/" />
            <link rel="canonical" href="./portal/" />
            <script>
              // Preserve any query/hash the user arrived with so deep links work.
              (function () {
                var target = './portal/' + (window.location.search || '') + (window.location.hash || '');
                window.location.replace(target);
              })();
            </script>
            <style>
              :root { color-scheme: dark; }
              body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #0f172a; color: #e5e7eb; }
              a { color: #93c5fd; }
            </style>
          </head>
          <body>
            <p>Redirecting to the <a href="./portal/">Notechondria portal</a>…</p>
          </body>
          </html>
          EOF

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/pages
          keep_files: true
