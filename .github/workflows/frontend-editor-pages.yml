name: frontend-editor-pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

on:
  push:
    branches: [ codex ]
    paths:
      - 'frontend/editor_app/**'
      - '.github/workflows/frontend-editor-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Flutter pub get
        working-directory: frontend/editor_app
        run: flutter pub get

      - name: Flutter test
        working-directory: frontend/editor_app
        run: flutter test test/smoke_test.dart -r compact

      - name: Flutter build web
        working-directory: frontend/editor_app
        run: flutter build web --release --base-href /editor/

      - name: Stage site
        run: |
          mkdir -p /tmp/pages/editor
          cp -R frontend/editor_app/build/web/. /tmp/pages/editor/

      - name: Deploy to gh-pages/editor
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/pages
          keep_files: true
