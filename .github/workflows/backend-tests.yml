name: backend-tests

# CI test leg for the Django backend + the MCP CLI, added in 0.1.161.
# This is the canonical pre-deploy verification now that local Docker
# runs of this project are banned on small dev hosts (see
# docs/AGENTS.md "Deployment topology & no-local-containers rule"):
# the owner pushes, this proves the suites, and Northflank deploys the
# backend on commit independently.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'cli/**'
      # Local folder contract fixtures, checked by notes/test_api_contract.py
      # (design docs/development/local_folder_mode/testing.md 8.4, Q14).
      - 'frontend/notechondria_shared/test/fixtures/api_v1/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Django test suite (settings_test, in-memory sqlite)
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: notechondria.settings_test
        run: python manage.py test

      # The live answers the contract test recorded for each fixture, from
      # the test database's seeded account only (no credentials), so a
      # fixture can be refreshed without a local backend.
      - name: Upload contract responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-responses
          path: backend/build/contract_responses/
          if-no-files-found: ignore
          retention-days: 14

  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CLI unit tests (stdlib only)
        working-directory: cli
        run: python -m unittest discover -s tests -v
