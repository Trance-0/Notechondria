server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend_nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/ {
    proxy_pass http://backend_nginx;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /static/ {
    proxy_pass http://backend_nginx;
  }

  location /media/ {
    proxy_pass http://backend_nginx;
  }

  location /editor/ {
    proxy_pass http://editor_frontend/;
  }

  location /planner/ {
    proxy_pass http://planner_frontend/;
  }

  location /portal/ {
    proxy_pass http://portal_frontend/;
  }

  location = / {
    return 302 /portal/;
  }
}
