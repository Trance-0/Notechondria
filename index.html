<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notechondria</title>
  <meta http-equiv="refresh" content="0; url=./portal/" />
  <link rel="canonical" href="./portal/" />
  <script>
    // Preserve any query/hash the user arrived with so deep links work.
    (function () {
      var target = './portal/' + (window.location.search || '') + (window.location.hash || '');
      window.location.replace(target);
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #0f172a; color: #e5e7eb; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <p>Redirecting to the <a href="./portal/">Notechondria portal</a>…</p>
</body>
</html>
