name: notechondria-fullstack

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRE_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRE_DB:-postgres}
    ports:
      - "${DB_HOST_PORT:-9032}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRE_USERNAME: ${POSTGRE_USERNAME:-postgres}
      POSTGRE_PASSWORD: ${POSTGRE_PASSWORD:-postgres}
      POSTGRE_HOST: db
      POSTGRE_PORT: 5432
      POSTGRE_DB: ${POSTGRE_DB:-postgres}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_PRODUCTION_STATIC_ROOT: /home/staticfiles/
      DJANGO_PRODUCTION_MEDIA_ROOT: /home/mediafiles/
    depends_on:
      - db

  backend_nginx:
    build:
      context: ./backend/nginx
      dockerfile: Dockerfile
    environment:
      NGINX_BACKEND_ORIGIN: http://app:8000
    depends_on:
      - app
    ports:
      - "${APP_HOST_PORT:-9060}:80"

  editor_frontend:
    build:
      context: ./frontend/editor_app
      dockerfile: Dockerfile
      args:
        FRONTEND_API_BASE_URL: http://localhost:${ROOT_HTTP_PORT:-8080}/api/v1
        APP_BASE_HREF: /editor/
    environment:
      FRONTEND_BACKEND_ORIGIN: http://backend_nginx
    depends_on:
      - backend_nginx

  planner_frontend:
    build:
      context: ./frontend/planner_app
      dockerfile: Dockerfile
      args:
        FRONTEND_API_BASE_URL: http://localhost:${ROOT_HTTP_PORT:-8080}/api/v1
        APP_BASE_HREF: /planner/
    environment:
      FRONTEND_BACKEND_ORIGIN: http://backend_nginx
    depends_on:
      - backend_nginx

  portal_frontend:
    build:
      context: ./frontend/portal_app
      dockerfile: Dockerfile
      args:
        FRONTEND_API_BASE_URL: http://localhost:${ROOT_HTTP_PORT:-8080}/api/v1
        APP_BASE_HREF: /portal/
    environment:
      FRONTEND_BACKEND_ORIGIN: http://backend_nginx
    depends_on:
      - backend_nginx

  gateway_nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend_nginx
      - editor_frontend
      - planner_frontend
      - portal_frontend
    ports:
      - "${ROOT_HTTP_PORT:-8080}:80"
    volumes:
      - ./deployment/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
