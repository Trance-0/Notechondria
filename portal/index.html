<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Notechondria/portal/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Without this tag iPhone Safari lays the page out on a ~980px
       virtual viewport and the app renders its desktop breakpoint
       shrunken down. viewport-fit=cover lets SafeArea own the notch /
       home-indicator insets in standalone (Add to Home Screen) mode. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Public landing and navigation shell for the Notechondria platform.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Notechondria Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Startup fallback (0.1.198) and boot surface (0.1.199): see the
       #nc-boot block in <body>. */
    #nc-boot {
      position: fixed; inset: 0; z-index: 0; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 24px; text-align: center;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc; color: #334155;
    }
    /* While loading: a static copy of the Flutter splash header (title and
       status line at 8vw from the right, 12vh from the bottom), so the
       first Flutter frame replaces it without a second loading screen. */
    #nc-boot:not([data-state]) {
      align-items: flex-end; justify-content: flex-end;
      padding: 0 8vw 12vh 0; text-align: right;
    }
    #nc-boot[data-state="failed"] { z-index: 2147483646; }
    #nc-boot p { margin: 0; max-width: 40em; }
    #nc-boot .nc-boot-header { display: flex; flex-direction: column; gap: 8px; }
    #nc-boot:not([data-state]) .nc-boot-header { align-items: flex-end; }
    #nc-boot .nc-boot-title { font-weight: 600; }
    #nc-boot:not([data-state]) .nc-boot-title {
      font-size: 28px; line-height: 36px; font-weight: 700; color: #0f172a;
    }
    #nc-boot .nc-boot-status { font-size: 16px; line-height: 24px; opacity: 0.5; }
    #nc-boot[data-state] .nc-boot-status { display: none; }
    #nc-boot .nc-boot-reload {
      font: inherit; padding: 8px 16px; border: 0; border-radius: 6px;
      background: #B45309; color: #fff; cursor: pointer;
    }
    #nc-boot .nc-boot-reload:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      #nc-boot { background: #0f172a; color: #e2e8f0; }
      #nc-boot:not([data-state]) .nc-boot-title { color: #f8fafc; }
    }
  </style>
</head>
<body>
  <!-- Startup fallback (0.1.198) and boot surface (0.1.199). While loading
       it shows no spinner: it is a static copy of the Flutter splash header
       (same background, title, and "Starting ..." status in the same place),
       so when the first Flutter frame covers it the user sees one loading
       screen, not two. It sits under Flutter's view and is removed on the
       `flutter-first-frame` event. If flutter_bootstrap.js cannot be
       downloaded, the Flutter loader throws, or nothing has rendered after
       20s, it shows why and offers a reload instead of a blank page (the
       0.1.196/0.1.197 white screen). Messages follow AGENTS.md 1.8. -->
  <div id="nc-boot" role="status" aria-live="polite">
    <div class="nc-boot-header">
      <p class="nc-boot-title">Notechondria Portal</p>
      <p class="nc-boot-status">Starting Notechondria Portal</p>
    </div>
    <p class="nc-boot-detail" hidden></p>
    <button type="button" class="nc-boot-reload" hidden>Reload</button>
  </div>
  <noscript>
    <p style="font: 15px/1.5 system-ui, sans-serif; padding: 24px;">Notechondria Portal cannot start: web bootstrap / script check &mdash; JavaScript is disabled in this browser. Enable JavaScript and reload the page.</p>
  </noscript>
  <script>
    (function () {
      var APP = 'Notechondria Portal';
      var SLOW_MS = 20000;
      var root = document.getElementById('nc-boot');
      var done = false;
      var slowTimer = null;
      function part(name) { return root.querySelector('.nc-boot-' + name); }
      function engineStarted() {
        return !!document.querySelector('flutter-view, flt-glass-pane');
      }
      function show(state, title, detail) {
        if (done) return;
        root.setAttribute('data-state', state);
        part('status').hidden = true;
        part('title').textContent = title;
        part('detail').textContent = detail;
        part('detail').hidden = false;
        part('reload').hidden = false;
      }
      function onError(event) {
        var file = (event && event.filename) || '';
        if (!/flutter(_bootstrap)?\.js|main\.dart\.(m?js|wasm)|canvaskit/.test(file)) return;
        window.ncBootFailed('Flutter loader',
          (event.message || 'script error') + ' in ' + file.split('/').pop());
      }
      function onRejection(event) {
        // Once the engine runs, the Dart-side startup guards own failures.
        if (engineStarted()) return;
        var reason = event && event.reason;
        window.ncBootFailed('Flutter loader', 'unhandled promise rejection: ' +
          (reason && reason.message ? reason.message : String(reason)));
      }
      function finish() {
        if (done) return;
        done = true;
        clearTimeout(slowTimer);
        window.removeEventListener('error', onError);
        window.removeEventListener('unhandledrejection', onRejection);
        if (root.parentNode) root.parentNode.removeChild(root);
      }
      // Used by the flutter_bootstrap.js <script onerror> below as well.
      window.ncBootFailed = function (process, cause) {
        var message = APP + ' could not start: web bootstrap / ' + process +
          ' \u2014 ' + cause + '. Reload the page; if this keeps happening, ' +
          'clear this site\u2019s data or try another browser.';
        if (window.console) console.error(message);
        show('failed', APP + ' could not start', message);
      };
      window.addEventListener('error', onError);
      window.addEventListener('unhandledrejection', onRejection);
      window.addEventListener('flutter-first-frame', finish);
      slowTimer = setTimeout(function () {
        var stage = engineStarted() ? 'first frame' : 'engine load';
        var message = APP + ' has not finished loading: web bootstrap / ' +
          stage + ' \u2014 nothing was rendered within ' + (SLOW_MS / 1000) +
          's (slow network, blocked script, or unsupported browser). ' +
          'Keep waiting, or reload the page.';
        if (window.console) console.warn(message);
        show('slow', APP + ' is taking longer than expected', message);
      }, SLOW_MS);
      part('reload').addEventListener('click', function () {
        window.location.reload();
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async onerror="ncBootFailed('script download', 'flutter_bootstrap.js could not be downloaded (network error or missing file)')"></script>
  <script>
    // Ctrl/⌘ + wheel is the activity calendar's time-axis zoom. Without
    // this, the BROWSER's page-zoom hijacks the gesture before Flutter
    // ever sees it, which is why in-app zoom "didn't work" — stop the
    // default so the app handles it.
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey || e.metaKey) e.preventDefault();
    }, { passive: false });
  </script>
  <script>
    // Service-worker update toast. When a new build's worker installs
    // while an old one still controls the page (the one-reload-stale
    // window of Flutter's content-hash-versioned worker), surface a
    // one-tap reload instead of leaving the user on the old shell.
    // No-op when service workers are unsupported or stripped by the
    // Pages workflow kill switch (STRIP_SERVICE_WORKER=true).
    (function () {
      if (!('serviceWorker' in navigator)) return;
      var shown = false;
      function showReloadToast() {
        if (shown) return;
        shown = true;
        var toast = document.createElement('div');
        toast.setAttribute('role', 'status');
        toast.style.cssText =
          'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
          'z-index:2147483647;background:#1e293b;color:#e5e7eb;' +
          'padding:10px 16px;border-radius:8px;font:14px system-ui,sans-serif;' +
          'box-shadow:0 4px 12px rgba(0,0,0,.4);display:flex;gap:12px;' +
          'align-items:center;';
        toast.appendChild(document.createTextNode(
          'A new version of Portal is available.'));
        var button = document.createElement('button');
        button.textContent = 'Reload';
        button.style.cssText =
          'background:#3b82f6;color:#fff;border:0;border-radius:6px;' +
          'padding:6px 12px;font:inherit;cursor:pointer;';
        button.addEventListener('click', function () {
          window.location.reload();
        });
        toast.appendChild(button);
        document.body.appendChild(toast);
      }
      function watch(registration) {
        if (registration.waiting && navigator.serviceWorker.controller) {
          showReloadToast();
        }
        registration.addEventListener('updatefound', function () {
          var worker = registration.installing;
          if (!worker) return;
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' &&
                navigator.serviceWorker.controller) {
              showReloadToast();
            }
          });
        });
      }
      window.addEventListener('load', function () {
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          navigator.serviceWorker.getRegistration().then(function (reg) {
            if (reg) {
              clearInterval(timer);
              watch(reg);
            } else if (tries > 20) {
              clearInterval(timer); // worker stripped or never registered
            }
          });
        }, 1500);
      });
    })();
  </script>
</body>
</html>
